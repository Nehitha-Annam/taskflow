<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow - Register</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-logo">

        <div class="logo-icon">
            ✓
        </div>

        <h1>
            TaskFlow
        </h1>

    </div>


    <h2>
        Create Account
    </h2>


    <p class="auth-subtitle">
        Start managing your tasks today
    </p>


    <form id="registerForm">


        <label for="registerName">
            Full Name
        </label>

        <input
            type="text"
            id="registerName"
            placeholder="Enter your name"
            required
        >


        <label for="registerEmail">
            Email
        </label>

        <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
            required
        >


        <label for="registerPassword">
            Password
        </label>

        <input
            type="password"
            id="registerPassword"
            placeholder="Create a password"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
        >


        <button
            type="submit"
            class="auth-btn"
        >
            Create Account
        </button>

    </form>


    <p class="auth-switch">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>


</div>


<script src="../js/auth.js"></script>

</body>

</html>
