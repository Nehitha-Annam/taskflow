<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow - Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-logo">

        <div class="logo-icon">
            ✓
        </div>

        <h1>
            TaskFlow
        </h1>

    </div>


    <h2>
        Welcome Back
    </h2>


    <p class="auth-subtitle">
        Login to manage your tasks
    </p>


    <form id="loginForm">


        <label for="loginEmail">
            Email
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
        >


        <label for="loginPassword">
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="auth-btn"
        >
            Login
        </button>

    </form>


    <p class="auth-switch">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </p>


</div>


<script src="../js/auth.js"></script>

</body>

</html>
